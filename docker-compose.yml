# Local development services. Ports are bound to 127.0.0.1 so the throwaway
# credentials below are never reachable from the network.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bakimevi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakim_user
      POSTGRES_PASSWORD: bakim_pass
      POSTGRES_DB: bakim_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakim_user -d bakim_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-test:
    image: postgres:16-alpine
    container_name: bakimevi-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakim_user
      POSTGRES_PASSWORD: bakim_pass
      POSTGRES_DB: bakim_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakim_user -d bakim_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bakimevi-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    # minio/minio is no longer published on Docker Hub; this pinned Bitnami
    # build starts the server and the console (:9001) on its own.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: bakimevi-minio
    restart: unless-stopped
    environment:
      # Local development only. Production rejects these values at startup.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
